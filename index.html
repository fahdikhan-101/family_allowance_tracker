<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Pocket Money</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f7fafc; margin: 0; padding: 16px; color: #2d3748; }
    .container { max-width: 480px; margin: 0 auto; }
    .card { background: #ffffff; border-radius: 16px; padding: 22px; margin-bottom: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.06); text-align: center; }
    .greeting { font-size: 1.1rem; font-weight: 700; color: #4a5568; margin-bottom: 4px; }
    .balance-label { font-size: 0.85rem; font-weight: 700; color: #a0aec0; text-transform: uppercase; letter-spacing: 0.5px; }
    .balance-amount { font-size: 3.2rem; font-weight: 800; color: #38a169; margin: 6px 0 0 0; }
    .action-card { text-align: left; background: #ffffff; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.06); }
    h3 { margin-top: 0; margin-bottom: 12px; font-size: 1.15rem; color: #2b6cb0; }
    select, input { width: 100%; padding: 14px; margin-bottom: 12px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 1rem; }
    button { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 1.05rem; font-weight: 700; cursor: pointer; color: white; }
    .btn-green { background: #38a169; }
    .btn-blue { background: #3182ce; }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; margin-top: 8px; }
    th, td { padding: 10px 6px; text-align: left; border-bottom: 1px solid #edf2f7; }
    .pos { color: #38a169; font-weight: 700; }
    .neg { color: #e53e3e; font-weight: 700; }
    .denied-alert { background: #fff5f5; border: 1.5px solid #feb2b2; border-radius: 12px; padding: 14px; margin-bottom: 16px; text-align: left; }
    .denied-item { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed #fed7d7; font-size: 0.9rem; }
    .denied-item:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Balance Card -->
    <div class="card">
      <div class="greeting" id="childGreeting">Hello!</div>
      <div class="balance-label">Total Savings</div>
      <div id="balanceVal" class="balance-amount">$0.00</div>
    </div>

    <!-- Denied Feedback Banner -->
    <div class="denied-alert" id="deniedSection" style="display: none;">
      <strong style="color: #c53030; font-size: 0.95rem; display: block; margin-bottom: 6px;">Note from Mom/Dad:</strong>
      <div id="deniedList"></div>
    </div>

    <!-- Claim Chore -->
    <div class="action-card">
      <h3>I Finished a Chore!</h3>
      <select id="choreSelect"><option>Loading chores...</option></select>
      <button class="btn-green" onclick="sendChore()">Ask Parents to Check</button>
    </div>

    <!-- Log Spend -->
    <div class="action-card">
      <h3>I Spent Money</h3>
      <input type="number" id="spendAmt" step="0.01" placeholder="How much?">
      <input type="text" id="spendDesc" placeholder="What did you buy?">
      <button class="btn-blue" onclick="sendExpense()">Deduct from Savings</button>
    </div>

    <!-- Transactions -->
    <div class="action-card">
      <h3>History</h3>
      <table>
        <thead>
          <tr><th>Date</th><th>What</th><th>Amount</th></tr>
        </thead>
        <tbody id="txBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    // Paste your Google Apps Script /exec URL here:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx9XQECAp7VLwD0Pw2AiKC553q-W7t2RsOvBqrbdyDDu4WxZO5hSphCFMJE2K4oyls/exec";

    const urlParams = new URLSearchParams(window.location.search);
    const childToken = urlParams.get('child');

    function refresh() {
      if (!childToken) {
        alert("Missing child token in URL. Example: ?child=abi-1243");
        return;
      }

      fetch(`${SCRIPT_URL}?child=${encodeURIComponent(childToken)}&format=json`)
        .then(res => res.json())
        .then(data => {
          if (data.error) throw new Error(data.error);

          document.getElementById('childGreeting').innerText = `Hello, ${data.name}!`;
          document.getElementById('balanceVal').innerText = '$' + Number(data.balance).toFixed(2);

          // Denied feedback
          const deniedBox = document.getElementById('deniedSection');
          const deniedList = document.getElementById('deniedList');
          deniedList.innerHTML = '';
          if (data.deniedChores && data.deniedChores.length > 0) {
            deniedBox.style.display = 'block';
            data.deniedChores.slice(0, 3).forEach(d => {
              deniedList.innerHTML += `<div class="denied-item">
                <span style="color:#9b2c2c; font-weight:700;">${d.title}</span> was not approved.<br>
                <em style="color:#742a2a;">"${d.reason}"</em>
              </div>`;
            });
          } else {
            deniedBox.style.display = 'none';
          }

          // Chores dropdown
          const choreSelect = document.getElementById('choreSelect');
          choreSelect.innerHTML = '';
          if (!data.chores || data.chores.length === 0) {
            choreSelect.innerHTML = '<option value="">No chores available</option>';
          } else {
            data.chores.forEach(c => {
              choreSelect.innerHTML += `<option value="${c.id}">${c.title} (+$${Number(c.reward).toFixed(2)})</option>`;
            });
          }

          // Ledger
          const tbody = document.getElementById('txBody');
          tbody.innerHTML = '';
          if (!data.history || data.history.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#a0aec0;">No history yet</td></tr>';
            return;
          }

          data.history.forEach(tx => {
            const isPos = tx.amount >= 0;
            tbody.innerHTML += `<tr>
              <td>${tx.date}</td>
              <td>${tx.desc}</td>
              <td class="${isPos ? 'pos' : 'neg'}">${isPos ? '+' : ''}$${Math.abs(tx.amount).toFixed(2)}</td>
            </tr>`;
          });
        })
        .catch(err => alert("Error loading data: " + err.message));
    }

    function sendChore() {
      const choreId = document.getElementById('choreSelect').value;
      if (!choreId) return alert("Please select a chore.");

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'submitChore', token: childToken, choreId: choreId })
      })
      .then(res => res.json())
      .then(res => {
        if (res.error) throw new Error(res.error);
        alert('Sent to your parents for approval!');
      })
      .catch(err => alert("Chore error: " + err.message));
    }

    function sendExpense() {
      const amt = document.getElementById('spendAmt').value;
      const desc = document.getElementById('spendDesc').value;
      if (!amt || !desc) return alert('Please enter both amount and description.');

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'submitExpense', token: childToken, amount: amt, desc: desc })
      })
      .then(res => res.json())
      .then(res => {
        if (res.error) throw new Error(res.error);
        document.getElementById('spendAmt').value = '';
        document.getElementById('spendDesc').value = '';
        refresh();
      })
      .catch(err => alert("Expense error: " + err.message));
    }

    refresh();
  </script>
</body>
</html>
